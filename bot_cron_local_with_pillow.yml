name: Bot de Apuestas - Radar y Canal Telegram

on:
  schedule:
    # Se ejecuta automáticamente cada hora (minuto 15)
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow para tarjetas PNG de Telegram
        run: pip install pillow

      - name: Ejecutar liquidación, escaneo, Telegram y web estática
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python cloud_runner.py

      - name: Guardar cambios (historial y GitHub Pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trades.db docs/
          if ! git diff --cached --quiet; then
            git commit -m "Actualización automática del bot y resultados"
            git push
          else
            echo "Sin cambios nuevos que guardar."
          fi
