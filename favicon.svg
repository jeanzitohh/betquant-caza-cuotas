<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="cazaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="55%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <filter id="cazaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cazaBgGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

  <!-- Tactical Target / Crosshair rings -->
  <circle cx="32" cy="32" r="23" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="16" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>

  <!-- Crosshair Reticle Ticks -->
  <line x1="32" y1="5" x2="32" y2="12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="59" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="5" y1="32" x2="12" y2="32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="59" y2="32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Monogram CC / Caza Cuotas Typography -->
  <text x="32" y="39.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1.5px" filter="url(#cazaGlow)">CC</text>
  
  <!-- Subtle center cross point -->
  <circle cx="32" cy="32" r="1.5" fill="#FDE047"/>
</svg>
